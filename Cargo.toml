[package]
name = "x-clone-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[workspace]
members = ["backend", "src-tauri"]
resolver = "2"

# ワークスペース全体のリリース用ビルド設定。各メンバー（src-tauri など）に書いても無視されるため、ここに置く（B-011）。
# 詳細: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true